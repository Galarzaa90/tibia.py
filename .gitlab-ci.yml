image: python:3.9-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: 10
  DOCKER_DRIVER: overlay2

before_script:
  - python -m venv venv
  - source venv/bin/activate

stages:
  - build
  - test
  - deploy

cache:
  key: "${CI_JOB_NAME}"
  paths:
    - .cache/pip
    - venv/
    - .sonar/cache

build:
  stage: build
  script:
    - python -m pip install build
    - python -m build
  artifacts:
    name: tibia.py-dist
    paths:
      - dist/

docs:
  stage: build
  image: python:3.12-slim
  script:
    - pip install -U -e .[docs]
    - zensical build
  artifacts:
    name: tibia.py-docs
    paths:
      - site/

coverage:
  stage: test
  script:
    - pip install -U -e .[testing]
    - coverage run
    - coverage report
    - coverage html
    - coverage xml
  artifacts:
    name: Coverage_Report
    paths:
      - htmlcov/
      - coverage.xml

pages:
  stage: deploy
  image: alpine
  cache: { }
  dependencies:
    - docs
    - coverage
  before_script: [ ]
  script:
    - mkdir public
    - mv htmlcov/ public/coverage/
    - mv site/* public/
  artifacts:
    paths:
      - public
  only:
    - main
    - dev
